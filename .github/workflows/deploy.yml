name: Deploy
# Deployment is GATED until the Hostinger VPS is provisioned.
# Set the DEPLOY_READY repository secret once the server is ready; until then
# build-and-push is skipped and nothing is built or deployed.
# No Dockerfiles exist yet -- add them when setting up the VPS.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Gate: skip the whole build until DEPLOY_READY is set on the repository.
    if: secrets.DEPLOY_READY != ''
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'staging'
    needs: build-and-push
    environment: staging

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        echo "Image digest: ${{ needs.build-and-push.outputs.image-digest }}"
        # Add your staging deployment commands here (e.g. ssh to Hostinger VPS, docker compose up).

  deploy-production:
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'production'
    needs: build-and-push
    environment: production

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        echo "Image digest: ${{ needs.build-and-push.outputs.image-digest }}"
        # Add your production deployment commands here.

  notify:
    runs-on: ubuntu-latest
    if: always() && needs.build-and-push.result == 'success'
    needs: [build-and-push, deploy-staging, deploy-production]
    steps:
    - name: Notify deployment status
      run: |
        if [ "${{ needs.deploy-production.result }}" == "success" ] || [ "${{ needs.deploy-staging.result }}" == "success" ]; then
          echo "✅ Deployment successful"
        else
          echo "⚪ Deployment gated or skipped (set the DEPLOY_READY secret once the Hostinger VPS is ready)."
        fi
