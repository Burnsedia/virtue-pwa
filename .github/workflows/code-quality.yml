name: Code Quality

on:
  push:
    branches: [ master ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ master ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'

jobs:
  python-quality:
    runs-on: ubuntu-latest
    # Django package is in backend/core/; run tools from there so manage.py and
    # settings are on the path. No need for the broken head_commit.modified filter
    # -- the paths: filter above already scopes this workflow.
    defaults:
      run:
        working-directory: ./backend/core

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-quality-${{ hashFiles('backend/core/requirments.txt') }}

    - name: Install Python quality tools
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy bandit safety

    - name: Check Python code formatting with Black
      run: black --check --diff . --exclude env

    - name: Check Python imports with isort
      run: isort --check-only --diff . --skip env

    - name: Lint Python code with flake8
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --max-line-length=88

    - name: Security check with Bandit
      run: bandit -r . --exclude env -f json -o bandit-report.json || true

    - name: Check for insecure dependencies
      run: safety check --file requirments.txt --output json || true

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run Astro type checking
      run: npm run check

    - name: Run ESLint (if configured)
      run: npx eslint . --ext .js,.ts,.vue,.astro || true

    - name: Check for security vulnerabilities
      run: npm audit --audit-level moderate --json > audit-results.json || true

  codeql-analysis:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: javascript, python

    - name: Autobuild
      uses: github/codeql-action/autobuild@v2

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
